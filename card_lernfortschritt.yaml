type: custom:apexcharts-card
grid_options:
  columns: full
header:
  title: SFML Lernfortschritt
  show: true
  show_states: true
  colorize_states: true
graph_span: 30d
apex_config:
  chart:
    height: 320px
  legend:
    show: true
    position: bottom
    fontSize: 11px
  yaxis:
    - seriesName: Genauigkeit 7d-Ø
      min: 0
      max: 140
      tickAmount: 7
      labels:
        formatter: |
          EVAL:function(val) { return val + '%'; }
      title:
        text: Genauigkeit / R² (%)
        style:
          color: "#4CAF50"
          fontSize: 12px
    - seriesName: R² 7d-Ø
      min: 0
      max: 140
      tickAmount: 7
      show: false
    - seriesName: MAE 7d-Ø
      opposite: true
      min: 0
      max: 12
      tickAmount: 4
      labels:
        formatter: |
          EVAL:function(val) { return val.toFixed(1) + ' kWh'; }
      title:
        text: MAE (kWh)
        style:
          color: "#F44336"
          fontSize: 12px
  tooltip:
    shared: true
    "y":
      formatter: |
        EVAL:function(val, { seriesIndex }) {
          if (val === null || val === undefined) return '';
          if (seriesIndex <= 1) return val.toFixed(1) + '%';
          if (seriesIndex === 2) return val.toFixed(2) + ' kWh';
          return val.toFixed(1);
        }
series:
  - entity: sensor.sfml_lernfortschritt_2
    name: Genauigkeit 7d-Ø
    data_generator: |
      var data = JSON.parse(entity.attributes.chart_data);
      return data.map(function(d, i) {
        var win = data.slice(Math.max(0, i - 6), i + 1);
        var avg = win.reduce(function(s, x) { return s + x.accuracy; }, 0) / win.length;
        return [new Date(d.date).getTime(), Math.round(avg * 10) / 10];
      });
    color: "#4CAF50"
    stroke_width: 3
    type: line
    curve: smooth
    show:
      in_header: false
  - entity: sensor.sfml_tagliche_genauigkeit_2
    name: R² 7d-Ø
    data_generator: |
      var data = JSON.parse(entity.attributes.chart_data);
      data.sort(function(a, b) { return a.date < b.date ? -1 : 1; });
      return data.map(function(d, i) {
        var win = data.slice(Math.max(0, i - 6), i + 1);
        if (win.length < 4) return [new Date(d.date).getTime(), null];
        var n = win.length;
        var sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0;
        for (var j = 0; j < n; j++) {
          var x = win[j].predicted, y = win[j].actual;
          sx += x; sy += y; sxx += x*x; syy += y*y; sxy += x*y;
        }
        var num = n * sxy - sx * sy;
        var den = Math.sqrt((n*sxx - sx*sx) * (n*syy - sy*sy));
        if (den === 0) return [new Date(d.date).getTime(), null];
        var r2 = Math.pow(num / den, 2) * 100;
        return [new Date(d.date).getTime(), Math.round(r2 * 10) / 10];
      });
    color: "#1E88E5"
    stroke_width: 3
    type: line
    curve: smooth
    show:
      in_header: false
  - entity: sensor.sfml_lernfortschritt_2
    name: MAE 7d-Ø
    data_generator: |
      var data = JSON.parse(entity.attributes.chart_data);
      return data.map(function(d, i) {
        var win = data.slice(Math.max(0, i - 6), i + 1);
        var vals = win.filter(function(x) { return x.error !== null; });
        if (vals.length === 0) return [new Date(d.date).getTime(), null];
        var avg = vals.reduce(function(s, x) { return s + x.error; }, 0) / vals.length;
        return [new Date(d.date).getTime(), Math.round(avg * 100) / 100];
      });
    color: "#F44336"
    stroke_width: 3
    type: line
    curve: smooth
    unit: " kWh"
    show:
      in_header: false
  - entity: sensor.sfml_lernfortschritt_2
    name: Genauigkeit
    color: "#4CAF50"
    unit: " %"
    show:
      in_header: raw
      in_chart: false
  - entity: sensor.sfml_modell_status_2
    name: R² Training
    attribute: r2
    color: "#FF9800"
    unit: " %"
    show:
      in_header: raw
      in_chart: false
  - entity: sensor.sfml_lernfortschritt_2
    name: MAE
    attribute: error_7d
    color: "#F44336"
    unit: " kWh"
    show:
      in_header: raw
      in_chart: false
