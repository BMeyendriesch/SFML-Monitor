# =============================================================================
# SFML Monitor — Lernfortschritt (Multi-KPI Übersicht)
# =============================================================================
# Benötigte Sensoren: sensor.sfml_lernfortschritt
#   → state = Ø Genauigkeit (67.5)
#   → attribute chart_data = JSON mit date/accuracy/error
#   → attribute error_7d = 7-Tage Ø Fehler (2.68)
# =============================================================================
type: custom:apexcharts-card
grid_options:
  columns: full
header:
  title: "SFML Lernfortschritt"
  show: true
  show_states: true
  colorize_states: true
graph_span: 40d
apex_config:
  chart:
    height: 320px
  legend:
    show: true
    position: bottom
    fontSize: "11px"
  yaxis:
    - seriesName: "Genauigkeit 7d-Ø"
      min: 0
      max: 100
      tickAmount: 5
      labels:
        formatter: |
          EVAL:function(val) { return val + '%'; }
      title:
        text: "Genauigkeit %"
        style:
          color: "#4CAF50"
          fontSize: "12px"
    - seriesName: "Genauigkeit täglich"
      show: false
    - seriesName: "Fehler 7d-Ø"
      show: false
    - seriesName: "Fehler 7d-Ø Trend"
      opposite: true
      min: 0
      max: 12
      tickAmount: 4
      labels:
        formatter: |
          EVAL:function(val) { return val.toFixed(1) + ' kWh'; }
      title:
        text: "Fehler kWh"
        style:
          color: "#F44336"
          fontSize: "12px"
    - seriesName: "Fehler täglich"
      show: false
  tooltip:
    shared: true
    y:
      formatter: |
        EVAL:function(val, { seriesIndex }) {
          if (val === null || val === undefined) return '';
          if (seriesIndex <= 1) return val.toFixed(1) + '%';
          return val.toFixed(2) + ' kWh';
        }
series:
  # --- Header links: Genauigkeit (state = 67.5) ---
  - entity: sensor.sfml_lernfortschritt
    name: "Genauigkeit 7d-Ø"
    data_generator: |
      var data = JSON.parse(entity.attributes.chart_data);
      return data.map(function(d, i) {
        var win = data.slice(Math.max(0, i - 6), i + 1);
        var avg = win.reduce(function(s, x) { return s + x.accuracy; }, 0) / win.length;
        return [new Date(d.date).getTime(), Math.round(avg * 10) / 10];
      });
    color: "#4CAF50"
    stroke_width: 3
    type: line
    curve: smooth
    unit: " %"
    show:
      in_header: raw

  - entity: sensor.sfml_lernfortschritt
    name: "Genauigkeit täglich"
    data_generator: |
      var data = JSON.parse(entity.attributes.chart_data);
      return data.map(function(d) {
        return [new Date(d.date).getTime(), d.accuracy];
      });
    color: "#4CAF50"
    stroke_width: 1
    type: area
    curve: stepline
    opacity: 0.15
    show:
      in_header: false

  # --- Header rechts: Fehler (attribute error_7d = 2.68) ---
  - entity: sensor.sfml_lernfortschritt
    name: "Fehler 7d-Ø"
    attribute: error_7d
    color: "#F44336"
    unit: " kWh"
    show:
      in_header: raw
      in_chart: false

  - entity: sensor.sfml_lernfortschritt
    name: "Fehler 7d-Ø Trend"
    data_generator: |
      var data = JSON.parse(entity.attributes.chart_data);
      return data.map(function(d, i) {
        var win = data.slice(Math.max(0, i - 6), i + 1);
        var vals = win.filter(function(x) { return x.error !== null; });
        if (vals.length === 0) return [new Date(d.date).getTime(), null];
        var avg = vals.reduce(function(s, x) { return s + x.error; }, 0) / vals.length;
        return [new Date(d.date).getTime(), Math.round(avg * 100) / 100];
      });
    color: "#F44336"
    stroke_width: 3
    type: line
    curve: smooth
    show:
      in_header: false

  - entity: sensor.sfml_lernfortschritt
    name: "Fehler täglich"
    data_generator: |
      var data = JSON.parse(entity.attributes.chart_data);
      return data.filter(function(d) { return d.error !== null; }).map(function(d) {
        return [new Date(d.date).getTime(), d.error];
      });
    color: "#EF9A9A"
    stroke_width: 1
    type: area
    curve: stepline
    opacity: 0.10
    show:
      in_header: false
