# =============================================================================
# SFML Monitor — Prognosegenauigkeit Trend (Line Chart)
# =============================================================================
type: custom:apexcharts-card
grid_options:
  columns: full
header:
  title: "Prognosegenauigkeit"
  show: true
  show_states: true
  colorize_states: true
graph_span: 30d
apex_config:
  chart:
    height: 280px
  legend:
    show: false
  yaxis:
    - labels:
        formatter: |
          EVAL:function(val) { return val + '%'; }
  tooltip:
    y:
      formatter: |
        EVAL:function(val) { return val.toFixed(1) + '%'; }
series:
  - entity: sensor.sfml_tagliche_genauigkeit_2
    name: "Ø Genauigkeit"
    data_generator: |
      var data = JSON.parse(entity.attributes.chart_data);
      return data.map(d => [new Date(d.date).getTime(), d.accuracy])
                 .sort(function(a, b) { return a[0] - b[0]; });
    color: "#4CAF50"
    stroke_width: 2
    type: line
    curve: smooth
    extend_to: false
    show:
      in_header: raw
      legend_value: false
