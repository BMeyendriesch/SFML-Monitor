# =============================================================================
# SFML Monitor — Drift-Ereignisse Timeline
# =============================================================================
# Zeigt Drift-Events als Punkte über die Zeit.
# Severity bestimmt den y-Wert (1=info, 2=warning, 3=critical).
# Scope (global vs. Gruppe) wird farblich unterschieden.
# Scatter wird simuliert via line + stroke_width 0 + markers.
#
# Benötigte Sensoren: sensor.sfml_drift_timeline_2
#   → state = Anzahl Events
#   → attribute chart_data = JSON mit date/scope/type/severity/value/desc
# =============================================================================
type: custom:apexcharts-card
grid_options:
  columns: full
header:
  title: "Drift-Ereignisse"
  show: true
  show_states: true
  colorize_states: true
graph_span: 40d
apex_config:
  chart:
    height: 280px
  legend:
    show: true
    position: bottom
    fontSize: "11px"
  markers:
    size: 8
  yaxis:
    - min: 0
      max: 4
      tickAmount: 4
      labels:
        formatter: |
          EVAL:function(val) {
            var labels = {1: 'Info', 2: 'Warning', 3: 'Critical'};
            return labels[val] || '';
          }
      title:
        text: "Schweregrad"
        style:
          fontSize: "12px"
  tooltip:
    shared: false
    y:
      formatter: |
        EVAL:function(val) {
          var labels = {1: 'Info', 2: 'Warning', 3: 'Critical'};
          return labels[val] || '';
        }
series:
  - entity: sensor.sfml_drift_timeline_2
    name: "Global"
    data_generator: |
      var data = JSON.parse(entity.attributes.chart_data);
      var sevMap = {info: 1, warning: 2, critical: 3};
      return data.filter(function(d) { return d.scope === 'global'; })
        .map(function(d) {
          return [new Date(d.date).getTime(), sevMap[d.severity] || 1];
        });
    type: line
    color: "#9E9E9E"
    stroke_width: 0
    show:
      in_header: raw

  - entity: sensor.sfml_drift_timeline_2
    name: "Gruppe 1"
    data_generator: |
      var data = JSON.parse(entity.attributes.chart_data);
      var sevMap = {info: 1, warning: 2, critical: 3};
      return data.filter(function(d) { return d.scope === 'Gruppe 1'; })
        .map(function(d) {
          return [new Date(d.date).getTime(), sevMap[d.severity] || 1];
        });
    type: line
    color: "#42A5F5"
    stroke_width: 0
    show:
      in_header: false

  - entity: sensor.sfml_drift_timeline_2
    name: "Gruppe 2"
    data_generator: |
      var data = JSON.parse(entity.attributes.chart_data);
      var sevMap = {info: 1, warning: 2, critical: 3};
      return data.filter(function(d) { return d.scope === 'Gruppe 2'; })
        .map(function(d) {
          return [new Date(d.date).getTime(), sevMap[d.severity] || 1];
        });
    type: line
    color: "#FF9800"
    stroke_width: 0
    show:
      in_header: false

  - entity: sensor.sfml_drift_timeline_2
    name: "Gruppe 3"
    data_generator: |
      var data = JSON.parse(entity.attributes.chart_data);
      var sevMap = {info: 1, warning: 2, critical: 3};
      return data.filter(function(d) { return d.scope === 'Gruppe 3'; })
        .map(function(d) {
          return [new Date(d.date).getTime(), sevMap[d.severity] || 1];
        });
    type: line
    color: "#AB47BC"
    stroke_width: 0
    show:
      in_header: false
